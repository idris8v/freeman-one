# Local isolated example, not a production configuration or deployment command.
services:
  bot:
    build: .
    image: freemanone:local-test
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 3
  postgres:
    image: postgres@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the isolated .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the isolated .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a test database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  app-data:
  postgres-data:
