<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;padding:2px;background:#f7f7fa;color:#1c1c1e;font:14px/1.3 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;--option:#fafafc}.sheet{max-width:420px;margin:auto;padding:8px}.brand,h2,.row,.between,.pay{display:flex;align-items:center;gap:6px}.brand{gap:9px;margin-bottom:12px}.appicon{width:30px;height:30px;color:#202020}.appicon svg{width:28px;height:28px}h1{font-size:20px;line-height:22px;font-weight:500;margin:0}.fee,.hint,#summary{font-size:12px;color:#6c6c70;margin:2px 0}h2{font-size:16px;line-height:20px;font-weight:600;margin:0 0 7px}.card{padding:8px;margin-bottom:6px;background:white;border:1px solid #ededf1;border-radius:18px}.icon{color:inherit;width:16px;height:16px;flex:none}.pay{text-decoration:none}button{appearance:none;-webkit-appearance:none;overflow:hidden;font:inherit;color:inherit;cursor:pointer;transition:transform .16s}button:active{transform:scale(.98)}button:disabled{opacity:.4}.choice{flex:none;width:calc(50% - 3px);position:relative;display:flex;align-items:center;gap:5px;min-width:0;min-height:40px;padding:6px 9px;text-align:left;border:1px solid #ededf1;border-radius:10px;background:var(--option)}.choice b{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px;font-weight:500}.choices{flex-wrap:wrap}.choice small{margin-left:auto;white-space:nowrap;font-size:12px;font-weight:500}.hint{font-size:11px;line-height:14px}.between{justify-content:space-between}.add{font-size:13px;font-weight:500}.touch{border:0;background:transparent;min-height:44px;padding:6px 0 6px 8px}.track{display:block;width:42px;height:26px;padding:2px;background:#e9e9eb;border-radius:16px;transition:background .2s}.knob{display:block;width:22px;height:22px;border-radius:50%;background:white;transition:transform .2s}.on .track{background:#34c759}.on .knob{transform:translateX(16px)}.pay{justify-content:center;width:100%;min-height:44px;margin-top:12px;padding:8px;border:1px solid #a6cfb9;border-radius:10px;background:linear-gradient(#44c86d,#2fb35a);color:white;font-size:15px;font-weight:600}.status{font-size:11px;line-height:13px;margin:4px 0}.status:empty,.hidden{display:none!important}@media(prefers-color-scheme:dark){body{background:#000;color:#f5f5f7;--option:#29292c}.card{background:#1c1c1e;border-color:#2c2c2e}.choice{border-color:#38383a}.hint,.fee,#summary{color:#a5a5ad}}@media(prefers-reduced-motion:reduce){button,.track,.knob{transition:none}}.amount{text-align:right}.amount strong{font-size:26px;line-height:28px;font-weight:600}.choice.on{border-color:#ff9500}.dot{width:12px;height:12px;flex:none;border:1px solid #999;border-radius:50%}.on .dot{border:4px solid #ff9500}.bill{padding:5px 3px 0}.bill #summary{font-size:16px;font-weight:600;color:inherit}.bill #kind:empty{display:none}.wallet{background:var(--option);border-color:#999;color:inherit}#checkout .hint{margin:8px 0}@media(prefers-color-scheme:dark){.pay{border-color:transparent}.track{background:#3a3a3c}.on .track{background:#248744}.appicon{color:#f5f5f7}}#devices .choice{width:calc(33.333% - 4px);justify-content:center}#devices .choice b{font-size:11px;white-space:normal}.card{margin-bottom:6px}#antig{padding:12px}#free{background:linear-gradient(#a43c59,#80213b);border-color:#92304c;color:white;box-shadow:inset 0 1px 0 #ffffff38}#custom{background:linear-gradient(#4a4f57,#30343b);border-color:#454b54;color:white;box-shadow:inset 0 1px 0 #ffffff38}.actionicon{width:17px;height:17px;flex:none;color:inherit}</style></head><body><main class="sheet"><header class="brand"><span class="appicon"><svg viewBox="0 0 1100 1080"><path fill="currentColor" d="M230 0h520l-40 75q-35 77-127 77H232q-80 0-80 80v86h428l-33 68q-39 79-127 79H232q-80 0-80 80v409L49 861Q0 820 0 761V236Q0 0 230 0Z"/><path fill="#ff8a00" d="M646 194a429 429 0 1 1-420 370h147a283 283 0 1 0 273-224Z"/></svg></span><h1 id="title">Выдача подписки</h1></header><div id="config"><section class="card"><h2>Сколько устройств?</h2><div class="row choices" id="devices"></div></section><section class="card"><h2>На какой срок?</h2><div class="row choices" id="months"></div></section><section class="card" id="antig"><h2>Нужна ли антиглушилка?</h2><div class="between"><div class="add">＋ Добавить антиглушилку · <span class="fee" id="fee"></span></div><button class="touch" id="extra" aria-label="Антиглушилка" aria-pressed="false"><span class="track"><span class="knob"></span></span></button></div><p class="hint">Сервер для подключения при ограничениях интернета.</p></section></div><section class="bill" id="actions"><button class="pay" id="sale"><span id="saletext"></span></button><button class="pay wallet" id="free"><svg class="actionicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11v10h16V11M3 7h18v4H3zM12 7v14M12 7H8a3 3 0 1 1 3-3l1 3Zm0 0h4a3 3 0 1 0-3-3l-1 3Z"/></svg>Выдать бесплатно</button><button class="pay wallet" id="custom"><svg class="actionicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 2h4l.5 3 2 1.2 2.8-1 2 3.4-2.3 2v2.8l2.3 2-2 3.4-2.8-1-2 1.2-.5 3h-4l-.5-3-2-1.2-2.8 1-2-3.4 2.3-2v-2.8l-2.3-2 2-3.4 2.8 1 2-1.2Z"/><circle cx="12" cy="12" r="3.2"/></svg>Свой срок и устройства</button></section><section class="card hidden" id="review"><h2>Вы выбрали</h2><p id="selected"></p><p class="between">Цена тарифа <b id="total"></b></p><p class="between">Продаж сегодня <b id="sales"></b></p><p class="between">Выручка сегодня <b id="revenue"></b></p><p class="between">После продажи <b id="after"></b></p><button class="pay" id="confirm">Выдать и учесть</button></section><p class="status" id="status" role="status"></p></main><script>var w=window.TelegramWidget,data=__DEMO_DATA__,plans=data.plans,d=plans[0][0],m=plans[0][1],extra=false,chosen,busy=false,stage=0,revision=0;
function el(id){return document.getElementById(id)}
function rub(n){return (n/100).toFixed(n%100?2:0).replace('.',',')+' ₽'}
function get(a,b){return plans.filter(function(p){return p[0]===a&&p[1]===b})[0]}
function button(label,price,on,disabled,fn){var b=document.createElement('button');b.className='choice'+(on?' on':'');b.style.borderRadius='10px';b.disabled=busy||disabled;b.setAttribute('aria-pressed',on);var c=document.createElement('span');c.className='dot';b.appendChild(c);var t=document.createElement('b');t.textContent=label;b.appendChild(t);if(price){var v=document.createElement('small');v.textContent=price;b.appendChild(v)}b.addEventListener('click',fn);return b}
if(data.recipient)document.querySelector('h1').textContent='Выдать ключ · '+data.recipient;
function draw(){if(!data.antig)extra=false;el('antig').classList.toggle('hidden',!data.antig);el('config').classList.toggle('hidden',stage===1);el('actions').classList.toggle('hidden',stage===1);el('review').classList.toggle('hidden',stage!==1);el('confirm').disabled=busy;el('confirm').textContent=busy?'Выдаём…':'Выдать и учесть';if(!get(d,m))m=plans.filter(function(p){return p[0]===d})[0][1];chosen=get(d,m);el('devices').innerHTML='';[1,3,5].forEach(function(n){el('devices').appendChild(button(n+' '+(n===1?'устройство':n===3?'устройства':'устройств'),'',n===d,!plans.some(function(p){return p[0]===n}),function(){d=n;draw()}))});el('months').innerHTML='';[1,3,6,12].forEach(function(n,i){var p=get(d,n);el('months').appendChild(button(['1 месяц','3 месяца','6 месяцев','1 год'][i],p?rub(p[2]):'—',m===n,!p,function(){m=n;draw()}))});var rate=chosen.length>4?chosen[4]:data.extra*m;el('fee').textContent='+'+rub(rate);el('extra').className='touch'+(extra?' on':'');el('extra').setAttribute('aria-pressed',extra);el('extra').disabled=busy;el('saletext').textContent=busy?'Выдаём…':'Выдать и учесть · '+rub(chosen[2]+(extra?rate:0));['sale','free','custom'].forEach(function(id){el(id).disabled=busy})}
function ask(op){if(busy)return;if(!w||!w.request){el('status').textContent='Обновите Telegram';return}var v=revision;busy=true;el('status').textContent='';draw();w.request(op).then(function(a){if(v!==revision)return;busy=false;var x=JSON.parse(a.result||'{}');if(x.review){var r=x.review;stage=1;el('selected').textContent=r.devices+' устр. · '+r.months+' мес.'+(r.antig?' + антиглушилка':'');['total','revenue','after'].forEach(function(id){el(id).textContent=r[id]===null?'Недоступно':rub(r[id])});el('sales').textContent=r.sales===null?'—':r.sales;}if(x.error)el('status').textContent=x.error;draw()},function(){if(v!==revision)return;busy=false;el('status').textContent='Повторите запрос';draw()})}
el('extra').addEventListener('click',function(){extra=!extra;draw()});el('sale').addEventListener('click',function(){ask('review:'+chosen[3]+':'+(extra?1:0))});el('free').addEventListener('click',function(){ask('free:'+chosen[3]+':'+(extra?1:0))});el('custom').addEventListener('click',function(){ask('custom:'+(extra?1:0))});el('confirm').addEventListener('click',function(){ask('confirm:'+chosen[3]+':'+(extra?1:0))});if(w&&w.onEvent)w.onEvent('chatDataChanged',function(){if(JSON.parse(w.chatData||'{}').selection){revision++;busy=false;stage=0;draw()}});draw();</script></body></html>
