<!doctype html><html lang="ru" data-ui-bundle="account"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-rounded-20261029.png"><title>Проверка подключения — Freeman ONE</title><link rel="stylesheet" href="/assets/account-management.css?v=5f7d3d8071a8"><script src="/assets/theme-init.js?v=0914e88d7a32"></script><style>@layer diagnostic-fallback {html{font:16px/1.5 system-ui;background:#f5f6f8;color:#17202d}body{max-width:620px;margin:40px auto;padding:20px}section{background:white;border:1px solid #e6e9ed;border-radius:18px;padding:22px}h1{font-size:24px;margin:0 0 12px}p{color:#596477}li{padding:10px 0;overflow-wrap:anywhere}button,a{font:inherit;display:inline-block;background:#fff;color:#17202d;border:1px solid #d9dfe7;border-radius:10px;padding:10px 14px;text-decoration:none;margin:6px 6px 0 0}button{cursor:pointer}pre{white-space:pre-wrap;font:13px/1.5 system-ui}} </style><section class="fo-card fo-scope fo-reading"><h1>Проверка подключения</h1><p>Эта страница работает отдельно от кабинета. Проверка не меняет данные аккаунта.</p><ol id="results"></ol><p id="summary" role="status">Проверяем загрузку файлов…</p><button class="fo-button fo-scope" id="copy" disabled>Скопировать результат</button><button class="fo-button fo-scope" onclick="location.reload()">Проверить снова</button><a class="fo-button fo-scope" href="/?connection_retry=263">Открыть кабинет</a><pre id="report"></pre></section><script>
(async()=>{
const tests=[['Главная страница','/'],['Настройки входа','/api/web/config'],['Программа кабинета','/assets/app.js?v=dd3ad2890cba'],['Основные стили','/assets/cabinet.css?v=a8a5f219b08a'],['Сеанс входа','/api/web/me']];
const lines=['Freeman ONE: проверка подключения',new Date().toISOString(),navigator.userAgent];let failed=0;
await Promise.all(tests.map(async([label,path])=>{const li=document.createElement('li');li.textContent=label+' — проверяем…';document.querySelector('#results').append(li);const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),10000),start=performance.now();try{const r=await fetch(path,{signal:ctrl.signal,cache:'no-store'});await r.arrayBuffer();const ms=Math.round(performance.now()-start);const ok=r.ok||(path==='/api/web/me'&&r.status===401);if(!ok)failed++;const message=label+' — '+(ok?'OK':'ошибка')+', HTTP '+r.status+', '+ms+' мс';li.textContent=message;lines.push(message)}catch(e){failed++;const message=label+' — '+(e.name==='AbortError'?'нет ответа за 10 секунд':e.message);li.textContent=message;lines.push(message)}finally{clearTimeout(timer)}}));
document.querySelector('#summary').textContent=failed?'Есть ошибки подключения. Скопируйте результат и передайте его в этот чат.':'Все проверенные запросы выполнены. Если кабинет зависает, передайте этот результат в чат для проверки запуска интерфейса.';
const report=lines.join('\n');document.querySelector('#report').textContent=report;const button=document.querySelector('#copy');button.disabled=false;button.onclick=async()=>{try{await navigator.clipboard.writeText(report);button.textContent='Скопировано'}catch{button.textContent='Скопируйте текст ниже'}};
})();
</script>
